app = "eco-api-staging"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # Dockerfile path is relative to this fly.toml's directory

[env]
  PORT = "3001"
  NODE_ENV = "production"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048

[processes]
  app = "sh -c 'node apps/api/dist/db/migrate.js && node apps/api/dist/index.js'"

[checks]
  # Readiness (DB + Redis), not shallow liveness — see fly.production.toml.
  [checks.health]
    type = "http"
    port = 3001
    path = "/health/ready"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
